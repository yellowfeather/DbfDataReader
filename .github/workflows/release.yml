name: Release

on:
  push:
    tags:
    - '*.*.*'

jobs:
  build:

    env:
      BUILD_CONFIG: 'Release'
      SOLUTION: 'DbfDataReader.sln'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # lets the job request the OIDC token that NuGet trusted publishing exchanges for a key

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build $SOLUTION --configuration $BUILD_CONFIG

    - name: Run tests
      run: dotnet test /p:Configuration=$BUILD_CONFIG --no-restore --no-build --verbosity normal

    - name: Pack
      run: dotnet pack ./src/DbfDataReader --output ./artifacts --configuration $BUILD_CONFIG --no-build

    - name: Push to MyGet
      env:
        NUGET_URL: ${{ secrets.MYGET_URL }}
        NUGET_API_KEY: ${{ secrets.MYGET_API_KEY }}
      run: dotnet nuget push ./artifacts/**.nupkg --source $NUGET_URL --api-key $NUGET_API_KEY --skip-duplicate

    # trusted publishing: exchange the job's OIDC token for a short-lived NuGet API key
    - name: NuGet login
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push ./artifacts/**.nupkg --source nuget.org --api-key $NUGET_API_KEY --skip-duplicate

    - name: Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: artifacts
        path: artifacts/**/*
